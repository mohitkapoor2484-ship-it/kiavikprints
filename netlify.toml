[build]
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/seller/inventory/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/seller/orders/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[redirects]]
  from = "/admin"
  to = "/seller/inventory/"
  status = 301

[[redirects]]
  from = "/admin.html"
  to = "/seller/inventory/"
  status = 301

[[redirects]]
  from = "/custom-print"
  to = "/custom-printing/"
  status = 301

[[redirects]]
  from = "/custom-print/*"
  to = "/custom-printing/"
  status = 301

[[redirects]]
  from = "/about-kiavik"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/about-kiavik/*"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/shop"
  to = "/"
  status = 301

[[redirects]]
  from = "/shop/"
  to = "/"
  status = 301

[[redirects]]
  from = "/shop/lamps-light-boxes/*"
  to = "/shop/?category=lamps-light-boxes"
  status = 301

[[redirects]]
  from = "/shop/personalised-gifts/*"
  to = "/shop/?category=personalised-gifts"
  status = 301

[[redirects]]
  from = "/shop/keychains/*"
  to = "/shop/?category=keychains"
  status = 301

[[redirects]]
  from = "/shop/signs-name-plates/*"
  to = "/shop/?category=signs-name-plates"
  status = 301

[[redirects]]
  from = "/shop/toys-fidgets/*"
  to = "/shop/?category=toys-fidgets"
  status = 301

[[redirects]]
  from = "/shop/home-decor/*"
  to = "/shop/?category=home-decor"
  status = 301

[[redirects]]
  from = "/shop/fathers-day-seasonal/*"
  to = "/shop/?category=fathers-day-seasonal"
  status = 301
